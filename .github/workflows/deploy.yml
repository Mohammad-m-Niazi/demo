name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hostgator_deploy"
          chmod 600 "$HOME/.ssh/hostgator_deploy"

          ssh-keyscan -t rsa -p 2222 -- "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTGATOR_SSH_USER }}
        run: |
          ssh \
            -p 2222 \
            -i "$HOME/.ssh/hostgator_deploy" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy to HostGator
        env:
          SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTGATOR_SSH_USER }}
          DEPLOY_PATH: /home3/mtcmfste/public_html/demo/
        run: |
          test -d dist
          test -f dist/index.html

          ssh \
            -p 2222 \
            -i "$HOME/.ssh/hostgator_deploy" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p \"$DEPLOY_PATH\""

          rsync \
            -avz \
            --delete \
            -e "ssh -p 2222 -i $HOME/.ssh/hostgator_deploy" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
